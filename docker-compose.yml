services:
  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
    depends_on:
      - redis

  worker:
    build: .
    command: rq worker --url redis://redis:6379
    volumes:
      - ./app:/app/app
    depends_on:
      - redis

  redis:
    image: redis:7
    ports:
      - "6379:6379"